[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "pybind11>=2.10.0",
    "numpy>=2.0.0",
    "pytest"
]

build-backend = "setuptools.build_meta"

[project]
name = "pybind11-examples"
version = "0.0.3"
authors = [
  { name="Andrew Smith", email="andrew@friarswood.net" },
]
license = "MIT"
license-files = ["LICENCE.md"]
description = "Examples of pybind11 implementation of various python constructs"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.0.0"
]


[dependency-groups]
dev = [
  "pybind11>=2.10.3",
  "pybind11-stubgen",
  "pytest>=7.1.3",
  "ty",
  "ruff",
  "build",
]


[project.urls]
"Homepage" = "https://github.com/virgesmith/pybind11-examples"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test"
]

[[tool.ty.overrides]]
include = ["setup.py"]
rules.unresolved-import = "ignore"

[tool.ruff]
lint.select = ["A", "E", "F", "I"]
lint.ignore = ["E501"]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
